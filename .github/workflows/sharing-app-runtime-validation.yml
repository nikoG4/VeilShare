name: Sharing App Runtime Validation

on:
  push:
    branches:
      - ci/sharing-app-runtime-validation-v2

permissions:
  contents: read

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate persona binding and core regressions
        run: ./gradlew :shared:core-model:desktopTest :shared:core-vault:desktopTest :shared:core-identity:desktopTest --no-daemon --stacktrace

      - name: Compile shared app surfaces for Desktop
        run: ./gradlew :shared:ui-features:compileKotlinDesktop :shared:app:compileKotlinDesktop :desktopApp:compileKotlin --no-daemon --stacktrace

      - name: Compile shared app surfaces for Android
        run: ./gradlew :shared:core-model:compileDebugKotlinAndroid :shared:core-vault:compileDebugKotlinAndroid :shared:core-identity:compileDebugKotlinAndroid :shared:ui-features:compileDebugKotlinAndroid :shared:app:compileDebugKotlinAndroid :androidApp:compileDebugKotlin --no-daemon --stacktrace
