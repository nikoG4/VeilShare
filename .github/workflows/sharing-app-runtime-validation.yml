name: Sharing App Runtime Validation

on:
  push:
    branches:
      - ci/sharing-app-runtime-validation-v3

permissions:
  contents: read

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Core and persona tests
        run: ./gradlew :shared:core-model:desktopTest :shared:core-vault:desktopTest :shared:core-identity:desktopTest --no-daemon --stacktrace

      - name: Compile app runtime and UI Desktop
        run: ./gradlew :shared:app:compileKotlinDesktop :shared:ui-features:compileKotlinDesktop :desktopApp:compileKotlin --no-daemon --stacktrace

      - name: Compile app runtime and UI Android
        run: ./gradlew :shared:app:compileDebugKotlinAndroid :shared:ui-features:compileDebugKotlinAndroid :androidApp:compileDebugKotlin --no-daemon --stacktrace
