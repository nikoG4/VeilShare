name: Android Sharing Persistence Instrumentation

on:
  push:
    branches:
      - ci/android-sharing-instrumentation-v2

permissions:
  contents: read

jobs:
  sharing-persistence-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android secure persistence instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./gradlew :shared:core-secure-store:connectedDebugAndroidTest :shared:core-contacts:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-sharing-instrumentation-reports
          path: |
            shared/core-secure-store/build/reports/androidTests/**
            shared/core-secure-store/build/outputs/androidTest-results/**
            shared/core-contacts/build/reports/androidTests/**
            shared/core-contacts/build/outputs/androidTest-results/**
          if-no-files-found: ignore
