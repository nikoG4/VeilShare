name: Patch Sharing Contact Verification V2

on:
  push:
    branches:
      - ci/patch-sharing-contact-verification-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sharing-ui-polish
          fetch-depth: 0
      - run: |
          git show origin/ci/patch-sharing-contact-verification-v2:.github/scripts/patch-sharing-contact-verification-v2.py > /tmp/patch-sharing-contact-verification-v2.py
          python /tmp/patch-sharing-contact-verification-v2.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/app/src/commonMain/kotlin/dev/veilshare/app/DefaultSharingRuntime.kt shared/ui-features
          git diff --cached --check
          git commit -m "feat: verify sharing contacts before transfer"
          git push origin HEAD:feature/sharing-ui-polish
