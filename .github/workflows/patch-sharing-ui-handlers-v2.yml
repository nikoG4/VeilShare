name: Patch Sharing UI Handlers V2

on:
  push:
    branches:
      - ci/patch-sharing-ui-handlers-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sharing-ui-polish
          fetch-depth: 0
      - name: Apply function-scoped guarded UI patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('shared/ui-features/src/commonMain/kotlin/dev/veilshare/ui/features/FoundationScreen.kt')
          s=p.read_text()

          def mutate_function(name, transform):
              global s
              marker=f'private fun {name}'
              start=s.find(marker)
              if start < 0: raise SystemExit(f'{name}: function not found')
              end=s.find('\n@Composable', start+1)
              if end < 0: end=len(s)
              segment=s[start:end]
              updated=transform(segment)
              if updated == segment: raise SystemExit(f'{name}: no change made')
              s=s[:start]+updated+s[end:]

          def terminal(seg):
              old='controller.cancelSharing()'
              if seg.count(old) != 1:
                  raise SystemExit(f'terminal handler expected exactly one cancel, found {seg.count(old)}')
              return seg.replace(old,'controller.finishSharing()')

          def incoming(seg):
              if seg.count('// TODO: Implement reject') != 1 or seg.count('// TODO: Implement accept') != 1:
                  raise SystemExit('incoming TODO guards did not match')
              seg=seg.replace('''onClick = { \n                        // TODO: Implement reject\n                        controller.cancelSharing()\n                    },''','''onClick = { controller.rejectIncomingSharing() },''')
              seg=seg.replace('''onClick = { \n                        // TODO: Implement accept\n                    },''','''onClick = { controller.acceptIncomingSharing() },''')
              if 'TODO: Implement reject' in seg or 'TODO: Implement accept' in seg:
                  raise SystemExit('incoming TODO replacement incomplete')
              return seg

          mutate_function('ReceiverIncomingScreen(state: SharingReceiverState.Incoming, controller: LocalAppController)', incoming)
          for name in [
              'SenderCompletedScreen(controller: LocalAppController)',
              'SenderErrorScreen(state: SharingSenderState.Error, controller: LocalAppController)',
              'SenderCancelledScreen(controller: LocalAppController)',
              'ReceiverCompletedScreen(controller: LocalAppController)',
              'ReceiverErrorScreen(state: SharingReceiverState.Error, controller: LocalAppController)',
              'ReceiverRejectedScreen(controller: LocalAppController)',
              'ReceiverCancelledScreen(controller: LocalAppController)',
          ]:
              mutate_function(name, terminal)
          p.write_text(s)
          PY
          git diff --check
          git diff -- shared/ui-features/src/commonMain/kotlin/dev/veilshare/ui/features/FoundationScreen.kt
      - name: Commit and push PR6
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/ui-features/src/commonMain/kotlin/dev/veilshare/ui/features/FoundationScreen.kt
          git commit -m "fix: wire sharing receiver and terminal actions"
          git push origin HEAD:feature/sharing-ui-polish
