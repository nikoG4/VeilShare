name: Sharing App Runtime Validation V7

on:
  push:
    branches:
      - ci/sharing-app-runtime-validation-v7

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Compile shared app Desktop and capture exact failure
        shell: bash
        run: |
          set +e
          ./gradlew :shared:app:compileKotlinDesktop --no-daemon --stacktrace > /tmp/compile.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            { grep -E "(^e: |error:|Unresolved reference|Cannot access|No matching|Could not resolve|FAILURE:|Exception is:)" /tmp/compile.log || true; } | tail -n 250 > ci-compile-errors.txt
            if [ ! -s ci-compile-errors.txt ]; then tail -n 250 /tmp/compile.log > ci-compile-errors.txt; fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ci-compile-errors.txt
            git commit -m "ci: capture compile errors [skip ci]"
            git push
            exit "$code"
          fi
      - name: Compile platform apps
        run: ./gradlew :desktopApp:compileKotlin :shared:app:compileDebugKotlinAndroid :androidApp:compileDebugKotlin --no-daemon --stacktrace
