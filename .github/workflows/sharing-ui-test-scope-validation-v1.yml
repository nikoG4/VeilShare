name: Sharing UI Test Scope Validation V1

on:
  push:
    branches:
      - ci/sharing-ui-test-scope-validation-v1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :shared:ui-features:desktopTest --no-daemon --stacktrace
