name: Beta Readiness Validation

on:
  push:
    branches:
      - feature/beta-readiness
      - feature/android-ux-overhaul
      - fix/sharing-presence-e2e
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-readiness-${{ github.ref }}
  cancel-in-progress: true

# Normal pushes intentionally run only the inexpensive quick-check job.
# Add [full-ci] to the final commit message (or use workflow_dispatch) to run
# the complete Android/Desktop/signaling release gate.
jobs:
  quick-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Whitespace and patch sanity
        run: git diff --check origin/feature/sharing-ui-polish...HEAD
      - name: Compile application layers and validate signaling
        run: >-
          ./gradlew
          :shared:app:compileDebugKotlinAndroid
          :shared:ui-features:compileDebugKotlinAndroid
          :server:signaling:test
          --no-daemon --stacktrace

  full-linux:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-ci]')
    needs: quick-check
    runs-on: ubuntu-latest
    env:
      VEILSHARE_PRODUCTION_SIGNALING_URL: wss://veilshare-signaling-production.up.railway.app/v1/ws
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Regression, production signaling probe and Android packages
        run: >-
          ./gradlew
          :shared:core-model:desktopTest
          :shared:core-crypto:desktopTest
          :shared:core-identity:desktopTest
          :shared:core-contacts:desktopTest
          :shared:core-transfer:desktopTest
          :shared:core-vault:desktopTest
          :shared:app:desktopTest
          :shared:ui-features:desktopTest
          :server:signaling:test
          :server:signaling:distZip
          :androidApp:assembleReleaseCheck
          :androidApp:assembleDebug
          -Pveilshare.signalingUrl=wss://veilshare-signaling-production.up.railway.app/v1/ws
          --no-daemon --stacktrace
      - name: Build signaling container
        run: docker build -f server/signaling/Dockerfile -t veilshare-signaling:ci .
      - uses: actions/upload-artifact@v4
        with:
          name: veilshare-android-beta-${{ github.sha }}
          path: androidApp/build/outputs/apk/releaseCheck/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: veilshare-android-debug-${{ github.sha }}
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: veilshare-signaling-${{ github.sha }}
          path: server/signaling/build/distributions/*.zip
          if-no-files-found: error

  full-windows:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-ci]')
    needs: quick-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Windows portable distribution
        shell: pwsh
        run: ./gradlew.bat :desktopApp:test :desktopApp:distZip --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: veilshare-desktop-windows-${{ github.sha }}
          path: desktopApp/build/distributions/*.zip
          if-no-files-found: error
