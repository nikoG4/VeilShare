name: Beta Readiness Validation

on:
  push:
    branches:
      - feature/beta-readiness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: >-
          ./gradlew
          :shared:core-model:desktopTest
          :shared:core-crypto:desktopTest
          :shared:core-identity:desktopTest
          :shared:core-contacts:desktopTest
          :shared:core-transfer:desktopTest
          :shared:core-vault:desktopTest
          :shared:app:desktopTest
          :shared:ui-features:desktopTest
          --no-daemon --stacktrace

  signaling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :server:signaling:test :server:signaling:distZip --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: veilshare-signaling-${{ github.sha }}
          path: server/signaling/build/distributions/*.zip
          if-no-files-found: error

  signaling-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :server:signaling:distZip -x :server:signaling:test --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: veilshare-signaling-smoke-${{ github.sha }}
          path: server/signaling/build/distributions/*.zip
          if-no-files-found: error

  android-beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: >-
          ./gradlew
          :shared:app:compileDebugKotlinAndroid
          :shared:ui-features:compileDebugKotlinAndroid
          :androidApp:assembleReleaseCheck
          -Pveilshare.signalingUrl=wss://relay.invalid/v1/ws
          --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: veilshare-android-beta-${{ github.sha }}
          path: androidApp/build/outputs/apk/releaseCheck/*.apk
          if-no-files-found: error

  android-physical-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Build physical-device debug APK for adb reverse
        run: >-
          ./gradlew
          :androidApp:assembleDebug
          -Pveilshare.signalingUrl=ws://127.0.0.1:8080/v1/ws
          --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: veilshare-android-physical-smoke-${{ github.sha }}
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  desktop-beta:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Windows portable distribution
        shell: pwsh
        run: ./gradlew.bat :desktopApp:test :desktopApp:distZip --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: veilshare-desktop-windows-${{ github.sha }}
          path: desktopApp/build/distributions/*.zip
          if-no-files-found: error

  signaling-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f server/signaling/Dockerfile -t veilshare-signaling:ci .

  diff-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git diff --check origin/feature/sharing-ui-polish...HEAD
